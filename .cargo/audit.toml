# cargo-audit configuration. Consumed by `cargo audit` locally and in CI.
#
# Every entry in `ignore` needs a reachability argument, not just a note that
# the advisory is inconvenient. An unexplained ignore is how a real
# vulnerability gets silently inherited by the next person who runs the audit.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack: RSA key recovery via timing sidechannel
    # in the `rsa` crate. No fixed version exists upstream.
    #
    # Not reachable here. `rsa` is compiled in only because `jsonwebtoken`
    # declares it for RSA-signed tokens, and this service never performs an RSA
    # operation: tokens are signed and verified with HMAC secrets
    # (`EncodingKey::from_secret` / `DecodingKey::from_secret` in
    # src/api/auth.rs) and `Validation::default()` accepts HS256 only, so an
    # `alg: RS256` token is rejected rather than routed into RSA code.
    #
    # Revisit if asymmetric JWT signing is ever introduced — that would make
    # this advisory live and this ignore wrong.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 — crypto-bigint <0.7.6, non-constant-time modular
    # arithmetic reachable through ECDSA verification. No lockfile-compatible
    # fix: the fix lives in the elliptic-curve 0.14 line while jsonwebtoken
    # 10.x (latest 10.4.0) still pins the 0.13 line via p256/p384.
    #
    # Not reachable here. crypto-bigint enters only via
    # jsonwebtoken -> p256/p384 -> ecdsa -> elliptic-curve, i.e. the ES256/
    # ES384 signing algorithms. This service signs and verifies with HMAC
    # secrets only (`EncodingKey::from_secret` / `DecodingKey::from_secret`
    # in src/api/auth.rs) and `Validation::default()` accepts HS256 only, so
    # no token ever routes into ECDSA code. Same reachability argument as the
    # rsa entry above.
    #
    # Revisit when jsonwebtoken ships a release built on elliptic-curve 0.14,
    # or if asymmetric JWT signing is ever introduced.
    "RUSTSEC-2026-0387",
    # RUSTSEC-2026-0459 — libsqlite3-sys <0.39 bundled SQLite security fixes.
    #
    # Not reachable here. libsqlite3-sys is in the lockfile only because the
    # sqlx facade crate unconditionally declares every database driver
    # (sqlx-sqlite -> libsqlite3-sys); our feature set enables postgres only
    # and no SQLite connection is ever established. `cargo tree --locked -i
    # libsqlite3-sys` prints nothing, so the crate is not in the active
    # feature graph and is not linked into the binary.
    #
    # Revisit when sqlx ships a release bundling libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]

# Unmaintained/unsound advisories stay visible as warnings rather than being
# ignored: they should be read on every run and acted on when a fix lands.
# Current known warning: yanked `chacha20 0.10.1`. It is locked only through
# reqwest's disabled HTTP/3 -> quinn-proto dependency and does not appear in
# the active feature graph (`cargo tree --locked -i chacha20@0.10.1` prints
# nothing). Both compatible 0.10 releases are yanked, so keep the newer one
# until reqwest/quinn publishes a lockfile-compatible replacement.
