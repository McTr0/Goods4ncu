name: deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build release binary and Flutter web
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build backend (release)
        run: cargo build --release --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Build Flutter web
        run: flutter build web --release --dart-define=COMPANION_ENABLED=true
        working-directory: mobile

      - name: Package artifacts
        run: |
          mkdir -p dist
          strip target/release/goods4ncu
          cp target/release/goods4ncu dist/goods4ncu
          tar -czf dist/web.tar.gz -C mobile/build/web .
          chmod +x dist/goods4ncu
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.event.workflow_run.head_sha }}
          path: dist/
          retention-days: 14

  deploy:
    name: Deploy to production server
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.sha }}
          path: dist

      - name: Configure trusted SSH connection
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Upload artifacts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -P "$DEPLOY_PORT")
          scp "${SSH_OPTS[@]}" dist/goods4ncu "$DEPLOY_USER@$DEPLOY_HOST:/opt/goods4ncu/bin/goods4ncu.new"
          scp "${SSH_OPTS[@]}" dist/web.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/goods4ncu-web.tar.gz"

      - name: Swap release, verify health, and roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_deploy -p "$DEPLOY_PORT")
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          app_root=/opt/goods4ncu
          binary_swapped=false
          web_swapped=false

          rollback() {
            original_status=$?
            trap - ERR
            set +e
            echo "deployment failed; restoring previous release" >&2
            "$app_root/stop.sh"
            if [[ "$binary_swapped" == true && -f "$app_root/bin/goods4ncu.previous" ]]; then
              mv -f "$app_root/bin/goods4ncu.previous" "$app_root/bin/goods4ncu"
            fi
            if [[ "$web_swapped" == true && -d "$app_root/web.previous" ]]; then
              rm -rf "$app_root/web.failed"
              mv "$app_root/web" "$app_root/web.failed"
              mv "$app_root/web.previous" "$app_root/web"
            fi
            "$app_root/start.sh"
            for _ in {1..10}; do
              if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
                echo "previous release restored" >&2
                exit "$original_status"
              fi
              sleep 3
            done
            echo "rollback failed health check; manual intervention required" >&2
            exit "$original_status"
          }
          trap rollback ERR

          chmod +x "$app_root/bin/goods4ncu.new"
          rm -f "$app_root/bin/goods4ncu.previous"
          cp -p "$app_root/bin/goods4ncu" "$app_root/bin/goods4ncu.previous"

          rm -rf "$app_root/web.new"
          mkdir -p "$app_root/web.new"
          tar -xzf /tmp/goods4ncu-web.tar.gz -C "$app_root/web.new"
          rm -f /tmp/goods4ncu-web.tar.gz

          "$app_root/stop.sh"
          mv -f "$app_root/bin/goods4ncu.new" "$app_root/bin/goods4ncu"
          binary_swapped=true
          rm -rf "$app_root/web.previous"
          mv "$app_root/web" "$app_root/web.previous"
          mv "$app_root/web.new" "$app_root/web"
          web_swapped=true
          "$app_root/start.sh"

          for _ in {1..10}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              trap - ERR
              echo "backend healthy"
              exit 0
            fi
            sleep 3
          done
          tail -50 "$app_root/logs/backend.log" >&2 || true
          false
          REMOTE
